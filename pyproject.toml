[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-capsule-agents"
version = "1.1.0"
description = "Isolated main/sub-agent capsules with CLI, MCP and Pi adapters"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
capsule-agents = "capsule.cli:entrypoint"

[tool.setuptools]
packages = ["capsule"]
